name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/pressroom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage

  boot:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Start the server and check it serves seeded content
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/pressroom_boot
          SESSION_SECRET: ci-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password-123
          PORT: 3000
        run: |
          node server.js &
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && break; sleep 1; done
          curl -sf localhost:3000/ | grep -q "mobile money"
          curl -sf localhost:3000/api/posts | grep -q '"total":6'
